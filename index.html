<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薬棚検索｜店舗専用</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#203047;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#174b74;color:#fff;padding:16px 20px}header h1{margin:0;font-size:21px}main{max-width:1150px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:#fff;border:1px solid #dce5f0;border-radius:13px;padding:16px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}input,button,select{font:inherit;border-radius:8px;padding:10px;border:1px solid #c5d0df;max-width:100%}button{background:#175e98;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#e6edf6;color:#174b74}button.red{background:#a33440}input[type=search]{flex:1;min-width:200px}input[type=file]{max-width:260px}.muted{color:#65758b;font-size:13px}.photo{position:relative;line-height:0;touch-action:auto}.photo.draw{touch-action:none}.photo img{width:100%;display:block;border-radius:8px}.overlay{position:absolute;inset:0;pointer-events:none}.mark{position:absolute;border:2px solid #dc9b18;background:#ffcf3845;pointer-events:auto;cursor:pointer}.mark.selected{border:4px solid #e92849;background:#e9284950;z-index:3}.mark.draft{border-style:dashed}.list{display:grid;gap:7px;max-height:450px;overflow:auto}.item{border:1px solid #dce5f0;border-radius:8px;padding:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}.item small{display:block;color:#65758b}.fields{display:grid;gap:8px}.fields label{display:grid;gap:4px;font-size:13px}.warning{border-left:4px solid #d99d27;padding:10px;background:#fff8eb;font-size:13px}.hidden{display:none!important}#status{font-size:13px;color:#315574;white-space:pre-wrap}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:9px}.card{padding:12px}}
</style></head><body><header><h1>💊 薬棚検索</h1><small>この店舗専用・ログイン不要の共有版</small></header><main>
<section id="app"><section class="card"><div class="row"><strong id="role">検索・編集ができます（ログイン不要）</strong><button class="alt" id="refresh">最新データに更新</button><span id="status"></span></div></section>
<section class="card"><div class="row"><input type="search" id="search" placeholder="薬品名・規格を検索（全棚対象）"><button class="alt" id="clear">クリア</button><label id="draftToggle"><input type="checkbox" id="showDraft">未確認も表示</label></div><p id="count" class="muted"></p><div id="results" class="list"></div></section>
<div class="grid"><section class="card"><div class="row"><label>棚 <select id="shelf"></select></label><span id="adminShelf" class="row"><input id="newShelf" placeholder="新しい棚名"><button id="addShelf">棚を追加</button></span></div><div id="adminPhoto"><div class="row"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">棚写真を更新</button><button id="draw" class="alt">位置を指定</button></div><p class="muted">上棚は段・列を選択。引き出しは段・列と必要に応じて中身の写真を登録できます。</p></div><div id="photo" class="photo"><img id="img" alt="薬棚の写真"><div id="overlay" class="overlay"></div></div><p id="photoHint" class="muted">棚写真がまだ登録されていません。</p></section>
<section class="card"><div id="editor"><h3>薬品登録・確認</h3><div class="fields"><label>場所の種類<select id="locationType"><option value="upper">上の薬棚（9段×33列）</option><option value="drawer">下の引き出し（4段×8列）</option></select></label><div class="row"><label>上から何段目<select id="gridRow"></select></label><label>左から何列目<select id="gridCol"></select></label></div><label>薬品名<input id="name"></label><label>規格<input id="strength" placeholder="例：2.5mg"></label><label>備考<input id="note" placeholder="例：引き出し内の右側"></label><label id="drawerPhotoField">引き出し内の写真（任意・薬ごとに登録可能）<input type="file" id="detailFile" accept="image/jpeg,image/png,image/webp"></label></div><p id="coords" class="muted">位置未指定</p><div id="detailView"></div><div class="row"><button id="confirm">確認して登録</button><button class="alt" id="pending">未確認で保存</button><button class="alt" id="reset">入力クリア</button><button class="red" id="remove">削除</button></div></div><div class="warning">登録位置は目安です。薬品名・剤形・規格は必ず現物と照合してください。</div><h3>選択した薬の近く</h3><p class="muted" id="nearHint">薬品の「場所を見る」を押すと、写真上で近くに登録された薬を表示します。</p><div id="nearby" class="list"></div><h3>この棚の登録</h3><div id="shelfItems" class="list"></div></section></div></section>
</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';const $=x=>document.getElementById(x);let sb,admin=true,shelves=[],medicines=[],shelfId='',selected='',rect=null,draw=false,start=null,imgUrl='';const setStatus=t=>$('status').textContent=t;const esc=s=>String(s||'');function loc(m){if(m.location_type&&m.grid_row&&m.grid_col)return (m.location_type==='drawer'?'下の引き出し':'上棚')+'・上から'+m.grid_row+'段目・左から'+m.grid_col+'列目';return '写真内の登録位置'}function gridRect(type,row,col){let rows=type==='drawer'?4:9,cols=type==='drawer'?8:33;return{x:(col-1)*100/cols,y:(row-1)*100/rows,w:100/cols,h:100/rows}}function updateGrid(){let type=$('locationType').value,rows=type==='drawer'?4:9,cols=type==='drawer'?8:33;for(let [id,n] of [['gridRow',rows],['gridCol',cols]]){let el=$(id),v=Number(el.value)||1;el.replaceChildren(...Array.from({length:n},(_,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=i+1;return o}));el.value=Math.min(v,n)}$('drawerPhotoField').classList.toggle('hidden',type!=='drawer');if(!selected){rect=gridRect(type,Number($('gridRow').value),Number($('gridCol').value));renderItems()}}function err(e){setStatus('エラー: '+(e?.message||e));console.error(e)}function must(data){if(data.error)throw data.error;return data.data}function selectedShelf(){return shelves.find(x=>x.id===shelfId)}function currentMedicine(){return medicines.find(x=>x.id===selected)}
async function init(){if(!window.SUPABASE_URL?.startsWith('https://')||!window.SUPABASE_ANON_KEY||window.SUPABASE_ANON_KEY.startsWith('YOUR_')){setStatus('設定が必要です：config.js にSupabaseのURLと公開用anonキーを設定してください。');return}sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});await reload()}
async function reload(){try{setStatus('読み込み中…');shelves=must(await sb.from('yakudana_shelves').select('*').order('name'));medicines=must(await sb.from('yakudana_medicines').select('*').order('name'));if(!shelves.some(x=>x.id===shelfId))shelfId=shelves[0]?.id||'';$('shelf').replaceChildren(...shelves.map(x=>{let o=document.createElement('option');o.value=x.id;o.textContent=x.name;return o}));$('shelf').value=shelfId;await render();setStatus('最新データを取得しました '+new Date().toLocaleTimeString('ja-JP'))}catch(e){err(e)}}$('refresh').onclick=reload;
async function render(){let s=selectedShelf();$('photoHint').textContent=s?.image_path?'画像を読み込みました':'棚写真がまだ登録されていません。';if(imgUrl){URL.revokeObjectURL(imgUrl);imgUrl=''}$('img').removeAttribute('src');if(s?.image_path){try{let {data,error}=await sb.storage.from('yakudana-shelf-images').download(s.image_path);if(error)throw error;imgUrl=URL.createObjectURL(data);$('img').src=imgUrl}catch(e){$('photoHint').textContent='画像を表示できません: '+e.message}}renderItems()}
function renderNearby(){let box=$('nearby'),hint=$('nearHint'),m=currentMedicine();box.replaceChildren();if(!m){hint.textContent='薬品の「場所を見る」を押すと、写真上で近くに登録された薬を表示します。';return}let cx=Number(m.x)+Number(m.w)/2,cy=Number(m.y)+Number(m.h)/2;let near=medicines.filter(n=>n.id!==m.id&&n.shelf_id===m.shelf_id&&m.location_type!=='drawer'&&n.location_type!=='drawer'&&($('showDraft').checked||n.confirmed)).map(n=>({n,d:Math.hypot((Number(n.x)+Number(n.w)/2-cx)*1.0,(Number(n.y)+Number(n.h)/2-cy)*1.0)})).sort((a,b)=>a.d-b.d).slice(0,5);hint.textContent=m.location_type==='drawer'?loc(m)+'（引き出しの薬は写真で確認）':m.name+' の近くに登録されている薬（位置順・最大5件）';if(!near.length){let p=document.createElement('p');p.className='muted';p.textContent='近くの登録薬はまだありません。';box.append(p)}else near.forEach(({n})=>box.append(itemRow(n)))}function renderItems(){let q=$('search').value.trim().toLowerCase(),all=medicines.filter(m=>($('showDraft').checked||m.confirmed)&&(!q||(m.name+' '+m.strength).toLowerCase().includes(q)));$('count').textContent=q?`${all.length}件ヒット`:'名前を入力すると全棚から検索します';let results=$('results');results.replaceChildren();if(q)all.forEach(m=>results.append(itemRow(m)));let current=medicines.filter(m=>m.shelf_id===shelfId&&($('showDraft').checked||m.confirmed));$('shelfItems').replaceChildren(...current.map(itemRow));$('overlay').replaceChildren();current.forEach(m=>{let d=document.createElement('div');d.className='mark'+(m.id===selected?' selected':'')+(m.confirmed?'':' draft');Object.assign(d.style,{left:m.x+'%',top:m.y+'%',width:m.w+'%',height:m.h+'%'});d.title=m.name+' '+m.strength;d.onclick=()=>pick(m);$('overlay').append(d)});if(rect&&!selected){let d=document.createElement('div');d.className='mark selected';Object.assign(d.style,{left:rect.x+'%',top:rect.y+'%',width:rect.w+'%',height:rect.h+'%'});$('overlay').append(d)}renderNearby();$('coords').textContent=rect?`位置：左${rect.x.toFixed(1)}% 上${rect.y.toFixed(1)}% 幅${rect.w.toFixed(1)}% 高さ${rect.h.toFixed(1)}%`:'位置未指定'}
function itemRow(m){let d=document.createElement('div');d.className='item';let t=document.createElement('div'),b=document.createElement('button');let strong=document.createElement('strong');strong.textContent=m.name+' '+m.strength;let small=document.createElement('small');small.textContent=(shelves.find(s=>s.id===m.shelf_id)?.name||'')+' / '+loc(m)+' / '+(m.confirmed?'確認済み':'未確認')+' / '+m.note;t.append(strong,small);b.className='alt';b.textContent='場所を見る';b.onclick=async()=>{if(shelfId!==m.shelf_id){shelfId=m.shelf_id;$('shelf').value=shelfId;await render()}pick(m);$('photo').scrollIntoView({behavior:'smooth',block:'center'})};d.append(t,b);return d}
async function showDetail(m){let view=$('detailView');view.replaceChildren();if(!m.detail_image_path)return;let p=document.createElement('p');p.textContent='引き出し内の写真';view.append(p);try{let res=await sb.storage.from('yakudana-shelf-images').download(m.detail_image_path);if(res.error)throw res.error;let im=document.createElement('img');im.style.cssText='width:100%;border-radius:8px';let u=URL.createObjectURL(res.data);im.src=u;im.onload=()=>URL.revokeObjectURL(u);view.append(im)}catch(e){p.textContent='写真を読み込めません: '+e.message}}function pick(m){selected=m.id;$('locationType').value=m.location_type||'upper';updateGrid();if(m.grid_row)$('gridRow').value=m.grid_row;if(m.grid_col)$('gridCol').value=m.grid_col;showDetail(m);rect={x:Number(m.x),y:Number(m.y),w:Number(m.w),h:Number(m.h)};$('name').value=m.name;$('strength').value=m.strength;$('note').value=m.note;renderItems()}
function reset(){selected='';rect=null;$('detailView').replaceChildren();$('detailFile').value='';['name','strength','note'].forEach(x=>$(x).value='');renderItems()}$('reset').onclick=reset;$('locationType').onchange=updateGrid;$('gridRow').onchange=()=>{if(!selected){rect=gridRect($('locationType').value,Number($('gridRow').value),Number($('gridCol').value));renderItems()}};$('gridCol').onchange=$('gridRow').onchange;updateGrid();$('search').oninput=renderItems;$('showDraft').onchange=renderItems;$('clear').onclick=()=>{$('search').value='';renderItems()};$('shelf').onchange=async()=>{shelfId=$('shelf').value;reset();await render()};
$('addShelf').onclick=async()=>{let name=$('newShelf').value.trim();if(!name)return;try{must(await sb.from('yakudana_shelves').insert({name}));$('newShelf').value='';await reload()}catch(e){err(e)}};
$('upload').onclick=async()=>{let f=$('file').files[0];if(!f||!shelfId)return alert('画像と棚を選択してください');if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024)return alert('10MB以下のJPEG/PNG/WebPを選択してください');try{setStatus('写真アップロード中…');let ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg',path=shelfId+'/'+crypto.randomUUID()+'.'+ext;must(await sb.storage.from('yakudana-shelf-images').upload(path,f,{contentType:f.type}));must(await sb.from('yakudana_shelves').update({image_path:path,updated_at:new Date().toISOString()}).eq('id',shelfId));await reload();setStatus('写真を更新しました。既存の位置登録は画像に合わせて確認してください。')}catch(e){err(e)}};
$('draw').onclick=()=>{draw=!draw;$('photo').classList.toggle('draw',draw);$('draw').textContent=draw?'位置指定中（終了）':'位置を指定'};function point(e){let r=$('img').getBoundingClientRect();return{x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}}$('photo').onpointerdown=e=>{if(!draw||!$('img').naturalWidth)return;e.preventDefault();$('photo').setPointerCapture(e.pointerId);start=point(e);selected=''};$('photo').onpointermove=e=>{if(!start)return;let p=point(e);rect={x:Math.min(p.x,start.x),y:Math.min(p.y,start.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};renderItems()};$('photo').onpointerup=()=>{start=null;if(rect&&(rect.w<.3||rect.h<.3))rect=null;renderItems()};
async function save(confirmed){let name=$('name').value.trim();if(!name||!shelfId)return alert('薬品名と場所を指定してください');let type=$('locationType').value,row=Number($('gridRow').value),col=Number($('gridCol').value),position=gridRect(type,row,col);let payload={shelf_id:shelfId,name,location_type:type,grid_row:row,grid_col:col,strength:$('strength').value.trim(),note:$('note').value.trim(),...position,confirmed,updated_at:new Date().toISOString()};try{let m=currentMedicine(),file=$('detailFile').files[0];if(file&&type==='drawer'){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)throw Error('写真は10MB以下のJPEG/PNG/WebPにしてください');let ext=file.type.split('/')[1].replace('jpeg','jpg'),path='details/'+crypto.randomUUID()+'.'+ext;must(await sb.storage.from('yakudana-shelf-images').upload(path,file,{contentType:file.type}));payload.detail_image_path=path}if(m)must(await sb.from('yakudana_medicines').update(payload).eq('id',m.id));else must(await sb.from('yakudana_medicines').insert(payload));reset();await reload()}catch(e){err(e)}}$('confirm').onclick=()=>save(true);$('pending').onclick=()=>save(false);$('remove').onclick=async()=>{if(!selected||!confirm('この薬品の登録を削除しますか？'))return;try{must(await sb.from('yakudana_medicines').delete().eq('id',selected));reset();await reload()}catch(e){err(e)}};
// Shared updates are fetched automatically every 20 seconds while this page is open.
setInterval(()=>{if(sb&&!draw&&!start&&!document.hidden)reload()},20000);
init().catch(err);
</script></body></html>
